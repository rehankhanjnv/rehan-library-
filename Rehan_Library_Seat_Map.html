<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rehan Library Seat Map</title>
<style>
:root{
  --bg:#f3efe6;--panel:#fffdf8;--ink:#1d2a2a;--muted:#6b7673;--line:#d9d2c2;
  --free:#2f7d6b;--free-ink:#fff;--taken:#cfc8b8;--taken-ink:#8b8473;--pick:#e0a526;--pick-ink:#1d2a2a;
  --bar:#b9ae96;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191a;--panel:#192324;--ink:#ece6d8;--muted:#93a09c;--line:#2c3a3a;
  --free:#3fa28b;--free-ink:#0d1514;--taken:#2b3636;--taken-ink:#5d6b67;--pick:#e8b23a;--pick-ink:#12191a;--bar:#3a4a4a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191a;--panel:#192324;--ink:#ece6d8;--muted:#93a09c;--line:#2c3a3a;
  --free:#3fa28b;--free-ink:#0d1514;--taken:#2b3636;--taken-ink:#5d6b67;--pick:#e8b23a;--pick-ink:#12191a;--bar:#3a4a4a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 14px 110px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem}
.stat b{font-size:1.1rem}
.hall{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;overflow-x:auto}
#room{position:relative;width:752px;border-left:4px solid var(--bar);margin-left:22px}
.rw{position:absolute;background:var(--bar)}
.seat.abs{position:absolute}
.d8{position:absolute;width:0;border-left:2px dashed var(--muted)}
.d8 span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}
.tbl{position:relative;width:max-content;margin-bottom:82px;margin-left:30px}
.tbl:nth-last-child(2){margin-bottom:34px}
.tbl.gap8{margin-bottom:110px}
.line{display:flex;gap:4px}
.bar{height:16px;background:var(--bar);border-radius:6px;margin:5px 0;font-size:.62rem;line-height:16px;padding-left:8px;color:var(--ink)}
.vdim{position:absolute;width:0;border-left:2px solid var(--muted)}
.vdim span,.hdim span{position:absolute;font-size:.7rem;color:var(--muted);white-space:nowrap}
.vdim span{left:6px;top:50%;transform:translateY(-50%)}
.hdim{position:absolute;height:0;border-top:2px dashed var(--muted)}
.hdim span{left:50%;top:-18px;transform:translateX(-50%)}
.gate svg{display:block}
.seat{width:30px;height:30px;border:0;border-radius:7px 7px 4px 4px;font:600 .68rem inherit;font-family:inherit;cursor:pointer;background:var(--free);color:var(--free-ink);padding:0;flex:none}
.seat[disabled]{background:var(--taken);color:var(--taken-ink);cursor:not-allowed}
.seat.pick{background:var(--pick);color:var(--pick-ink);outline:2px solid var(--ink);outline-offset:1px}
.seat:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.wall{width:100%;display:flex;justify-content:space-around;gap:12px;min-width:max-content;padding:8px 60px;margin-bottom:14px;border-block:3px solid var(--bar);color:var(--muted)}
.wall.bot{margin:18px 0 0}
.gate{position:absolute;width:36px;height:42px;display:flex;align-items:center;justify-content:center;border:2px solid var(--pick);border-radius:8px;color:var(--ink);background:var(--panel)}
.reqbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center}
.reqbar button{background:var(--ink);color:var(--bg);border:0;border-radius:9px;padding:10px 16px;font:600 .92rem inherit;font-family:inherit;cursor:pointer}
.reqbar button[disabled]{opacity:.35;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--free);color:var(--free-ink);padding:10px 16px;border-radius:9px;font-size:.9rem;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.seat{transition:transform .12s}.seat:not([disabled]):hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<main>
  <h1>Rehan Library seats</h1>
  <p class="sub">Pick a free seat and send a request. The admin approves or rejects it.</p>
  <div class="stats">
    <div class="stat"><b id="nFree">0</b> free</div>
    <div class="stat"><b id="nTaken">0</b> taken</div>
    <div class="stat"><b id="nAll">0</b> total</div>
  </div>
  <div class="hall" id="hall"></div>
  <div class="legend">
    <span><i style="background:var(--free)"></i>Free</span>
    <span><i style="background:var(--taken)"></i>Taken</span>
    <span><i style="background:var(--pick)"></i>Your pick</span>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="reqbar">
  <span id="pickTxt">No seat selected</span>
  <button id="reqBtn" disabled>Request seat</button>
</div>
<script>
// Layout read from the hand-drawn sketch (turned so the numbered ends are on the left).
function range(a,b){var r=[],s=a<=b?1:-1;for(var i=a;i!==b+s;i+=s)r.push(i);return r}
var TABLES=[
 {name:"Table 1 (along the wall)",top:[],bottom:range(13,1)},
 {name:"Table 2",top:range(14,24),bottom:range(35,25)},
 {name:"Table 3",top:range(36,49),bottom:range(63,50)},
 {name:"Table 4",top:range(64,76),bottom:range(90,77)},
 {name:"Table 5",top:range(91,103),bottom:range(116,104)},
 {name:"Table 6",top:range(117,134),bottom:range(152,135)},
 {name:"Table 7 (along the wall)",top:range(153,172),bottom:[]}
];
var P=34,FT=13.6,R1=30+564,R2=R1+150; // seat pitch, px per foot, right-wall positions inside the room
var seats={},picked=null,hall=document.getElementById("hall"),room=document.createElement("div");
room.id="room";hall.appendChild(room);

var AC='<svg viewBox="0 0 44 24" width="44" height="24" role="img" aria-label="AC" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><title>AC</title><rect x="2" y="2" width="40" height="12" rx="3"/><line x1="8" y1="10" x2="36" y2="10"/><path d="M12 18v3M22 18v4M32 18v3"/></svg>';
var DOOR='<svg viewBox="0 0 24 28" width="24" height="28" role="img" aria-label="Gate" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Gate</title><path d="M5 26V3h14v23M3 26h18"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/></svg>';

function makeSeat(n){
  var b=document.createElement("button");
  b.className="seat";b.textContent=n;b.dataset.n=n;b.setAttribute("aria-label","Seat "+n);
  var taken=false; // all seats free for now
  if(taken)b.disabled=true;
  seats[n]={taken:taken,el:b};
  b.addEventListener("click",function(){choose(+this.dataset.n)});
  return b;
}
function makeLine(list){var d=document.createElement("div");d.className="line";list.forEach(function(n){d.appendChild(makeSeat(n))});return d}
function wallEl(cls){var d=document.createElement("div");d.className="wall "+cls;d.innerHTML=AC+AC;return d}
function abs(el,l,t,w,h){el.style.left=l+"px";el.style.top=t+"px";if(w!=null)el.style.width=w+"px";if(h!=null)el.style.height=h+"px";room.appendChild(el);return el}
function gate(l,t,title){var g=document.createElement("div");g.className="gate";g.title=title;g.innerHTML=DOOR;g.style.cssText="left:"+l+"px;top:"+t+"px";return g}

var topWall=wallEl("top");topWall.style.width=(R1+4)+"px";room.appendChild(topWall);
var tbls=[];
TABLES.forEach(function(t,ti){
  var w=document.createElement("div");w.className="tbl"+(ti===4?" gap8":"");
  if(t.top.length)w.appendChild(makeLine(t.top));
  var bar=document.createElement("div");bar.className="bar";bar.textContent=t.name;w.appendChild(bar);
  if(t.bottom.length)w.appendChild(makeLine(t.bottom));
  room.appendChild(w);tbls.push(w);
  if(ti===1){ // aisle between tables 2 and 3: 6 ft marker and the gate on the left wall (between 35 and 36)
    var v=document.createElement("div");v.className="vdim";v.style.cssText="left:6px;top:100%;height:"+(6*FT)+"px";v.innerHTML="<span>6 ft</span>";w.appendChild(v);
  }
  if(ti===1||ti===4){var lg=gate(-50,0,"Gate");lg.style.top="calc(100% + 20px)";w.appendChild(lg)}
});
room.appendChild(wallEl("bot"));

// Right side: positions come from the table positions above.
var t2=tbls[1];
var gy=t2.offsetTop+t2.offsetHeight+41;          // centre of the aisle between tables 2 and 3
var top188=gy+8*FT;                               // first seat of the wall row is about 8 ft from the gate
var stepY=top188+8*P+4;                          // wall steps out below seat 177
var H=room.offsetHeight;
abs(Object.assign(document.createElement("div"),{className:"rw"}),R1,0,4,stepY);          // right wall, top part
abs(Object.assign(document.createElement("div"),{className:"rw"}),R1,stepY,R2-R1+4,4);    // step wall
abs(Object.assign(document.createElement("div"),{className:"rw"}),R2,stepY,4,H-stepY);    // right wall, lower part
room.appendChild(gate(R1-16,gy-21,"Entry gate")).style.zIndex=2;
var d8=document.createElement("div");d8.className="d8";d8.innerHTML="<span>8 ft</span>";abs(d8,R1-44,gy+21,null,top188-gy-21);
for(var i=0;i<8;i++){var n=184-i,b=makeSeat(n);b.classList.add("abs");abs(b,R1-36,top188+i*P);}   // 184 down to 177 along the wall
for(var j=0;j<4;j++){var m=176-j,c=makeSeat(m);c.classList.add("abs");abs(c,R1+8+j*P,stepY+8);}   // 176 to 173 under the step wall

function stats(){
  var all=Object.keys(seats).length,t=0;
  for(var k in seats)if(seats[k].taken)t++;
  document.getElementById("nTaken").textContent=t;
  document.getElementById("nFree").textContent=all-t;
  document.getElementById("nAll").textContent=all;
}
function choose(n){
  if(picked!==null)seats[picked].el.classList.remove("pick");
  picked=(picked===n)?null:n;
  if(picked!==null)seats[picked].el.classList.add("pick");
  document.getElementById("pickTxt").textContent=picked?("Seat "+picked+" selected"):"No seat selected";
  document.getElementById("reqBtn").disabled=!picked;
}
document.getElementById("reqBtn").addEventListener("click",function(){
  var t=document.getElementById("toast");
  t.textContent="Request for seat "+picked+" sent to admin (demo)";
  t.style.display="block";setTimeout(function(){t.style.display="none"},2600);
});
stats();
</script>
</body>
</html>
